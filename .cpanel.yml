---
# Manual escape hatch for msm.af.
#
# Deploys normally happen on their own: GitHub Actions publishes a build and a cron
# job on the server collects it (deploy/cpanel-release.sh). This entry only exists so
# that the "Deploy HEAD Commit" button under cPanel > Git Version Control forces a
# redeploy of the commit that is already live — useful after restoring a backup or
# changing something by hand.
deployment:
  tasks:
    - FORCE=1 /bin/bash /home2/msmaf/msm-src/deploy/cpanel-release.sh
