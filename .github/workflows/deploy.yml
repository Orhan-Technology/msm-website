name: Deploy to msm.af

# The production server builds the site itself: it has the Node 22 runtime the app
# runs on, so native modules (better-sqlite3) are compiled against the exact
# platform that will load them. This workflow's job is to ask it to do that, then
# report whether it worked.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and release on the cPanel server
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Request deployment
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          REPO_ROOT: /home2/msmaf/msm-src
        run: |
          set -euo pipefail
          response="$(curl -sS --fail-with-body --max-time 60 \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}" \
            --get "https://${CPANEL_HOST}:2083/execute/VersionControlDeployment/create" \
            --data-urlencode "repository_root=${REPO_ROOT}")"
          echo "$response" | python3 -m json.tool
          echo "$response" | python3 -c "
          import json,sys
          body = json.load(sys.stdin)
          if not body.get('status'):
              sys.exit('cPanel refused the deployment: %s' % body.get('errors'))
          "

      - name: Wait for the server to finish building
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          # A cold build (pnpm install + next build) takes a few minutes.
          for attempt in $(seq 1 60); do
            sleep 20
            response="$(curl -sS --max-time 60 \
              -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}" \
              "https://${CPANEL_HOST}:2083/execute/VersionControlDeployment/retrieve")"
            echo "$response" | python3 -c "
          import json,sys
          body = json.load(sys.stdin)
          rows = body.get('data') or []
          if not rows:
              print('::notice::deployment finished')
              sys.exit(0)
          row = rows[0]
          print('still deploying: %s (queued %s)' % (row.get('sse_url'), row.get('timestamps', {}).get('queued')))
          sys.exit(7)
          " && exit 0
          done
          echo "::error::the deployment did not finish within 20 minutes"
          exit 1
