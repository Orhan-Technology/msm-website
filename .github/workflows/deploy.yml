name: Deploy to msm.af

# The production host is a cPanel account whose CloudLinux limits cap every process
# at 4 GB of virtual address space — too little for Node 22 to even reserve its code
# range, so `pnpm install` and `next build` both fail there. The build therefore runs
# here, and the server only unpacks the result and restarts the app.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
  CPANEL_USER: ${{ secrets.CPANEL_USER }}
  CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
  # The panel's certificate is self-signed and expired, so it cannot be verified
  # against a CA; deploy/cpanel-api.sh pins this public key instead. Regenerate with:
  #   openssl s_client -connect HOST:2083 </dev/null | openssl x509 -pubkey -noout \
  #     | openssl pkey -pubin -outform der | openssl dgst -sha256 -binary | base64
  CPANEL_PIN: "+cJ6e2qxRgoifFJhpJZWCH9jD1logqNnklJPBsB/z2g="
  REPO_ROOT: /home2/msmaf/msm-src
  INCOMING_DIR: /home2/msmaf/incoming

jobs:
  deploy:
    name: Build and release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Inlined into the client bundle, so it has to be set at build time.
          NEXT_PUBLIC_SITE_URL: https://msm.af
        run: pnpm build

      - name: Package the build
        run: |
          set -euo pipefail
          rm -rf release
          cp -r .next/standalone release
          mkdir -p release/.next
          cp -r .next/static release/.next/static
          # public/ is in the repository, so the server takes it from its own
          # checkout rather than shipping 90 MB of images on every deploy.
          rm -rf release/public
          tar -czf msm-build.tar.gz -C release .
          ls -lh msm-build.tar.gz

      - name: Upload the build to the server
        run: |
          set -euo pipefail
          # cPanel creates the destination directory as part of the upload.
          bash deploy/cpanel-api.sh Fileman/upload_files \
            -F "dir=${INCOMING_DIR}" \
            -F "overwrite=1" \
            -F "file-1=@msm-build.tar.gz" > /dev/null

      - name: Point the server's checkout at this branch
        run: |
          set -euo pipefail
          # Pulls from GitHub and checks the branch out, so the .cpanel.yml the next
          # step runs is the one from this commit.
          CPANEL_TIMEOUT=300 bash deploy/cpanel-api.sh VersionControl/update \
            --data-urlencode "repository_root=${REPO_ROOT}" \
            --data-urlencode "branch=${GITHUB_REF_NAME}" > pull.json
          python3 -c "
          import json
          data = json.load(open('pull.json')).get('data') or {}
          print('branch:', data.get('branch'), 'head:', (data.get('last_update') or {}).get('identifier'))
          if str(data.get('deployable')) != '1':
              print('::error::cPanel will not deploy this checkout — is .cpanel.yml present on this branch?')
              raise SystemExit(1)
          "

      - name: Release it on the server
        run: |
          set -euo pipefail
          CPANEL_TIMEOUT=120 bash deploy/cpanel-api.sh VersionControlDeployment/create \
            --data-urlencode "repository_root=${REPO_ROOT}" > /dev/null

      - name: Wait for the release to finish
        run: |
          set -euo pipefail
          for _ in $(seq 1 40); do
            sleep 15
            # A transient blip here should retry rather than fail the deploy.
            if ! CPANEL_TIMEOUT=60 bash deploy/cpanel-api.sh VersionControlDeployment/retrieve \
                 > state.json 2>/dev/null; then
              echo "could not read deployment state, retrying..."
              continue
            fi
            if python3 -c "
          import json, sys
          sys.exit(0 if not (json.load(open('state.json')).get('data') or []) else 1)
          "; then
              echo "release finished"
              exit 0
            fi
            echo "still releasing..."
          done
          echo "::error::the release did not finish in time — check cPanel > Git Version Control"
          exit 1

      - name: Check the site responds
        run: |
          set -euo pipefail
          # msm.af may still point at the old host, so address this server directly.
          for attempt in $(seq 1 10); do
            code="$(curl -sS -o body.html -w '%{http_code}' --max-time 60 \
              -H "Host: msm.af" "http://${CPANEL_HOST}/" || echo 000)"
            echo "attempt ${attempt}: HTTP ${code}"
            if [ "$code" = "200" ]; then
              head -c 300 body.html
              exit 0
            fi
            sleep 15
          done
          echo "::error::msm.af returned ${code}, not 200 — $(head -c 300 body.html | tr -d '\r\n')"
          exit 1
