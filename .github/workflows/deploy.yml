name: Deploy to msm.af

# The production host is a cPanel account that cannot build this site itself:
# CloudLinux caps every process there at 4 GB of virtual address space, which is too
# little for Node 22 to reserve its code range, so pnpm and next both fail. Its panel
# API is also behind Imunify360 bot protection, which answers automated clients with
# a challenge page rather than JSON.
#
# So this workflow builds the site and publishes the result as a release asset, and a
# cron job on the server collects it (deploy/cpanel-release.sh). Nothing here needs a
# credential for the server, and nothing on the server needs one for GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write # to publish the build as a release asset

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Inlined into the client bundle, so it has to be set at build time.
          NEXT_PUBLIC_SITE_URL: https://msm.af
        run: pnpm build

      - name: Package the build
        run: |
          set -euo pipefail
          rm -rf release
          cp -r .next/standalone release
          mkdir -p release/.next
          cp -r .next/static release/.next/static
          # public/ is in the repository, so the server takes it from its own
          # checkout rather than shipping 90 MB of images on every deploy.
          rm -rf release/public
          tar -czf msm-build.tar.gz -C release .
          ls -lh msm-build.tar.gz

      - name: Publish the build for the server to collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The tag is the commit, which is how the server tells whether the build it
          # can see matches the commit it has fetched.
          gh release create "deploy-${GITHUB_SHA}" msm-build.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "Build ${GITHUB_SHA:0:7}" \
            --notes "Automated build of ${GITHUB_SHA}, collected by the cPanel host." \
            --prerelease

      - name: Wait for the server to pick it up
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
        run: |
          set -uo pipefail
          # The server polls every two minutes, then has to unpack and restart.
          # Addressed by IP with a Host header because msm.af may still point at the
          # old host while DNS is being moved.
          for attempt in $(seq 1 30); do
            sleep 20
            status="$(curl -fsS --max-time 30 -H "Host: msm.af" \
              "http://${CPANEL_HOST}/deploy-status.json" 2>/dev/null || true)"
            echo "attempt ${attempt}: ${status:-no response}"
            case "$status" in
              *"$GITHUB_SHA"*)
                echo "this commit is live"
                exit 0
                ;;
            esac
          done
          echo "::error::the server did not publish ${GITHUB_SHA} within 10 minutes — check ~/msm-app/deploy.log on the host"
          exit 1

      - name: Check the site responds
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
        run: |
          set -uo pipefail
          code="$(curl -sS -o body.html -w '%{http_code}' --max-time 60 \
            -H "Host: msm.af" "http://${CPANEL_HOST}/" || echo 000)"
          echo "HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::error::msm.af returned ${code}, not 200 — $(head -c 300 body.html | tr -d '\r\n')"
            exit 1
          fi
          head -c 300 body.html

      - name: Keep only the ten most recent builds
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName \
            --jq '.[].tagName | select(startswith("deploy-"))' \
            | tail -n +11 \
            | while read -r tag; do
                echo "removing old build ${tag}"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
              done
